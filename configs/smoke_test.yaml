# Smoke-test config: tiny run on Polyvore-630 to verify the pipeline end to end.
data:
  root: data/polyvore-u/original/tuples_630
  features: data/polyvore-u/features/resnet34
  batch_size: 64
  num_workers: 2
  num_users: 630
  num_fitb_choices: 4

train:
  neg_ratio: 1
  type_aware: true
valid:
  neg_ratio: 10
  type_aware: true
test:
  neg_ratio: 10
  type_aware: true

net:
  name: lpae_u
  backbone: resnet34
  use_visual: true
  use_nn_feature: true
  embd_dim: 128
  com_memory: false
  num_sab: 2
  num_points: 0
  num_seeds: 1
  num_proto: 64
  num_heads: 4
  logdet: true
  loss_weight: { rank_loss: 1.0, l1reg: 1.0e-2 }

optim:
  name: SGD
  lr: 0.01
  weight_decay: 1.0e-6
  param: { momentum: 0.9 }
  scheduler:
    name: ReduceLROnPlateau
    mode: max
    factor: 0.5
    patience: 10
    cooldown: 10

epochs: 1
grad_clip: 0.5
display_interval: 50
summary_interval: 100
seed: 2021
